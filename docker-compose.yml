version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secret-key-change-me
      - JWT_SECRET_KEY=production-jwt-secret-key-change-me
      - DATABASE_URL=postgresql://zehni_user:zehni_secure_pass@db:5432/zehni_sukoon
      - DASHSCOPE_API_KEY=your_production_api_key_here
      - DASHSCOPE_BASE_URL=https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - QWEN_MODEL=qwen-plus
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=zehni_user
      - POSTGRES_PASSWORD=zehni_secure_pass
      - POSTGRES_DB=zehni_sukoon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
